include:
    - project: "Infrastructure/freedesktop-ci-templates"
      file: "templates/fedora.yml"

variables:
    MESON_BUILD_DIR: _build
    CI_REGISTRY_IMAGE: registry.gitlab.gnome.org/gnome/gnome-autoar

stages:
    - image
    - test
    - deploy

.vars-devel:
    rules:
        # Disable tests for protected tags
        - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED
          variables:
              CONFIG_OPTS: '--libdir=/app/lib -Dprofile=Devel -Dtests=none'
        - when: always

workflow:
    rules:
        # Run merge request pipelines, for main or release branches, for
        # manually triggered pipelines (source "web"), and tags, but not for
        # translation updates
        - if: ($CI_PIPELINE_SOURCE == "merge_request_event" ||
               $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED ||
               $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH ||
               $CI_COMMIT_BRANCH =~ /^gnome-.*$/ ||
               $CI_PIPELINE_SOURCE == "web") &&
              $CI_COMMIT_TITLE !~ /^Update.*translation$/

.fedora:
    variables:
        FDO_DISTRIBUTION_VERSION: 44
        BASE_TAG: '2026-08-23.0'
        FDO_DISTRIBUTION_COMPRESSION_FORMAT: zstd:chunked
        FDO_DISTRIBUTION_PACKAGES:
            git
            gcc
            gi-docgen
            meson
            glibc-devel
            glib2-devel
            glibc-langpack-en
            gobject-introspection-devel
            libarchive-devel
            vala

.fedora-x86_64:
    extends:
        - .fedora
    variables:
        FDO_DISTRIBUTION_TAG: "x86_64-$BASE_TAG"
        FDO_UPSTREAM_REPO: gnome/gnome-autoar
    needs:
        - job: "update-fedora-image@x86_64"
          optional: true

update-fedora-image@x86_64:
    extends:
        - .fdo.container-build@fedora
        - .fedora-x86_64
    stage: image
    needs: []
    variables:
        GIT_STRATEGY: none
        FDO_DISTRIBUTION_EXEC: ".gitlab/image-script.sh"
        CFLAGS: "-fno-omit-frame-pointer"
    rules:
        - changes:
            - .gitlab-ci.yml
            - .gitlab/**/*
        - if: $CI_PROJECT_NAMESPACE != "GNOME"
          when: never

fedora:
    variables:
        LAST_ABI_BREAK: dd5450425a5348e62dee9a48e872f7705b63b692
    extends:
        - .fdo.distribution-image@fedora
        - .fedora-x86_64
        - .vars-devel
    stage: test
    script:
        - meson setup -Ddocs=false -Dintrospection=enabled -Dtests=true $MESON_BUILD_DIR
        - meson test -C $MESON_BUILD_DIR
        - check-abi $LAST_ABI_BREAK $(git rev-parse HEAD)
    artifacts:
        paths:
            - $MESON_BUILD_DIR
        reports:
            junit: $MESON_BUILD_DIR/meson-logs/testlog.junit.xml

pages:
    extends:
        - .fdo.distribution-image@fedora
        - .fedora-x86_64
    stage: deploy
    rules:
        # https://docs.gitlab.com/ee/ci/jobs/job_control.html#avoid-duplicate-pipelines
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_NAMESPACE == "GNOME"
    script:
        - meson setup -Ddocs=true -Dtests=false $MESON_BUILD_DIR
        - meson compile -C $MESON_BUILD_DIR
        - mv $MESON_BUILD_DIR/docs/reference/gnome-autoar/ public/
    artifacts:
        paths:
            - public/
        expire_in: 2 days
