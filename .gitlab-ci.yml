include:
    - component: gitlab.gnome.org/GNOME/citemplates/release-service@master
      inputs:
          dist-job-name: "build-gnomeos"
    - component: "gitlab.gnome.org/GNOME/citemplates/gnomeos-basic-ci@master"
      inputs:
          meson-options: "-Ddocs=true -Dtests=true"
          job-stage: "test"
          gobject-linter: "enabled"
          gobject-linter-options: "-c build-aux/gobject-linter.toml"
    - component: "gitlab.gnome.org/GNOME/citemplates/basic-deploy-docs@master"

workflow:
    rules:
        # Run merge request pipelines, for main or release branches, for
        # manually triggered pipelines (source "web"), and tags, but not for
        # translation updates
        - if: $CI_PIPELINE_SOURCE == "merge_request_event" ||
              $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED ||
              $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH ||
              $CI_COMMIT_BRANCH =~ /^gnome-.*$/ ||
              $CI_PIPELINE_SOURCE == "web"
